<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5e58" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>員工打卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="emp-wrap">
  <header class="emp-top">
    <div class="brand">
      <span class="brand-mark"><i data-icon="clock" data-size="20"></i></span>
      <div style="min-width:0"><div class="brand-name" id="company">員工打卡</div><div class="brand-sub">員工上下班打卡</div></div>
    </div>
    <button id="logoutBtn" class="btn secondary sm hidden" aria-label="切換人員"><i data-icon="users" data-size="16"></i>切換人員</button>
  </header>

  <section class="hero" aria-label="目前時間">
    <div class="hero-greet" id="heroGreet"></div>
    <div class="clock" id="clockTime" aria-live="off"><span class="hm">--:--</span><span class="sec">:--</span></div>
    <div class="hero-date" id="clockDate"></div>
    <div class="hero-status hidden" id="statusLine"></div>
  </section>

  <!-- 選擇姓名 -->
  <section id="pickView" class="hidden">
    <div class="pick-head"><h2>請選擇您的名字</h2><p>點選後輸入 4 位數 PIN 碼</p></div>
    <div class="names" id="names"></div>
    <div class="admin-link"><a href="/admin" class="btn ghost sm"><i data-icon="lock" data-size="16"></i>管理員登入</a></div>
  </section>

  <!-- 輸入 PIN -->
  <section id="pinView" class="hidden pin-view">
    <div id="pinAvatar"></div>
    <h2 id="pinName"></h2>
    <p>請輸入 4 位數 PIN 碼</p>
    <div class="pin-dots" id="pinDots" aria-label="已輸入的 PIN 位數"><span></span><span></span><span></span><span></span></div>
    <div class="keypad" id="keypad"></div>
  </section>

  <!-- 打卡主畫面 -->
  <section id="mainView" class="hidden">
    <h2 class="sr-only" id="hello"></h2>
    <div class="seg" role="tablist" aria-label="功能切換">
      <button role="tab" id="tabPunch" data-etab="punch" class="on" aria-selected="true" aria-controls="punchPane"><i data-icon="clock" data-size="18"></i>打卡</button>
      <button role="tab" id="tabLeave" data-etab="leave" aria-selected="false" aria-controls="leavePane"><i data-icon="palm" data-size="18"></i>請假<span class="count" id="leavePendCount"></span></button>
    </div>
    <div id="punchPane" role="tabpanel" aria-labelledby="tabPunch">
    <div class="pills hidden" id="checkCard"></div>
    <div class="block-card hidden" id="blockCard" role="alert"></div>
    <div class="punch-btns">
      <button class="punch in" id="btnIn"><span class="p-ic"><i data-icon="login" data-size="24"></i></span><span><span class="p-label">上班打卡</span><span class="p-sub" id="btnInSub">開始工作</span></span></button>
      <button class="punch out" id="btnOut"><span class="p-ic"><i data-icon="logout" data-size="24"></i></span><span><span class="p-label">下班打卡</span><span class="p-sub" id="btnOutSub">結束工作</span></span></button>
    </div>
    <div class="section-title">今日打卡</div>
    <div class="card" style="padding:10px 18px" id="todayList"></div>
    <div class="section-title">最近 14 天<span class="muted" id="recentHint"></span></div>
    <div class="recent" id="recentList"></div>
    </div>

    <!-- 請假 -->
    <div id="leavePane" class="hidden" role="tabpanel" aria-labelledby="tabLeave">
      <div class="card bal-card" id="balCard"></div>
      <div class="apply-btns">
        <button class="btn" id="newLeave"><i data-icon="calendarPlus" data-size="20"></i>申請請假</button>
        <button class="btn secondary" id="newWork"><i data-icon="home" data-size="20"></i>居家上班／公差</button>
      </div>
      <div class="section-title">我的申請<span class="muted" id="leaveHint"></span></div>
      <div class="leave-list" id="leaveList"></div>
    </div>
  </section>
</div>

<!-- 打卡確認 -->
<div class="sheet-bg hidden" id="confirmSheet" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="sheet">
    <div class="grab"></div>
    <div class="s-ic" id="confirmIc"></div>
    <h3 id="confirmTitle"></h3>
    <div class="s-time" id="confirmTime"></div>
    <p class="s-note" id="confirmNote"></p>
    <div class="s-actions">
      <button class="btn secondary" id="confirmCancel">取消</button>
      <button class="btn" id="confirmOk">確認打卡</button>
    </div>
  </div>
</div>

<!-- 請假申請 -->
<div class="sheet-bg hidden" id="leaveSheet" role="dialog" aria-modal="true" aria-labelledby="leaveSheetTitle">
  <form class="sheet form-sheet" id="leaveForm" novalidate>
    <div class="grab"></div>
    <div class="fs-head"><span class="s-ic"><i data-icon="calendarPlus" data-size="22"></i></span><div><h3 id="leaveSheetTitle">申請請假</h3><p id="leaveWorkHint"></p></div></div>
    <div class="fs-field">
      <span class="label" id="lfKindLabel">申請類型</span>
      <div class="opt-grid kinds" id="lfKinds" role="radiogroup" aria-labelledby="lfKindLabel"></div>
    </div>
    <div class="fs-field" id="lfTypeField">
      <span class="label" id="lfTypeLabel">假別</span>
      <div class="opt-grid" id="lfTypes" role="radiogroup" aria-labelledby="lfTypeLabel"></div>
      <p class="help hidden" id="lfTypeHint"></p>
    </div>
    <div class="fs-field" id="lfModeField">
      <span class="label" id="lfModeLabel">請假時段</span>
      <div class="opt-grid modes" id="lfModes" role="radiogroup" aria-labelledby="lfModeLabel"></div>
    </div>
    <div class="fs-field row2" id="lfDates">
      <div><label for="lfStart" id="lfStartLabel">開始日期</label><input type="date" id="lfStart" required></div>
      <div id="lfEndWrap"><label for="lfEnd">結束日期</label><input type="date" id="lfEnd"></div>
    </div>
    <div class="fs-field row2 hidden" id="lfTimes">
      <div><label for="lfStartT">開始時間</label><input type="time" id="lfStartT" step="900"></div>
      <div><label for="lfEndT">結束時間</label><input type="time" id="lfEndT" step="900"></div>
    </div>
    <div class="fs-field hidden" id="lfDestField">
      <label for="lfDest">公差地點<span class="muted" style="font-weight:400">（選填）</span></label>
      <input type="text" id="lfDest" maxlength="100" placeholder="例如：台中世貿中心、新竹客戶公司">
    </div>
    <div class="fs-field"><div class="preview-box" id="lfPreview" aria-live="polite"></div></div>
    <div class="fs-field">
      <label for="lfReason" id="lfReasonLabel">請假原因</label>
      <textarea id="lfReason" class="plain" maxlength="500" placeholder="例如：家庭旅遊、身體不適就醫" required></textarea>
    </div>
    <div class="fs-field" id="lfAttField">
      <span class="label">附件<span class="muted" style="font-weight:400">（選填，圖片或 PDF，5MB 以內）</span></span>
      <label class="file-pick" id="lfFilePick"><i data-icon="upload" data-size="20"></i><span>選擇檔案或拍照（例如診斷證明）</span><input type="file" id="lfFile" accept="image/*,application/pdf,.heic,.heif" class="sr-only"></label>
      <div class="file-chosen hidden" id="lfFileChosen"><i data-icon="paperclip" data-size="18"></i><span class="nm" id="lfFileName"></span><button type="button" class="btn ghost sm icon-only" id="lfFileClear" aria-label="移除附件"><i data-icon="x" data-size="18"></i></button></div>
    </div>
    <div class="s-actions">
      <button type="button" class="btn secondary" id="lfCancel">取消</button>
      <button type="submit" class="btn" id="lfSubmit"><i data-icon="check" data-size="18"></i>送出申請</button>
    </div>
  </form>
</div>

<!-- 打卡成功 -->
<div class="success-bg hidden" id="successOverlay" role="alertdialog" aria-live="assertive"></div>

<script src="/icons.js"></script>
<script src="/common.js"></script>
<script src="/employee.js"></script>
</body>
</html>
