<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>薪資單｜員工打卡系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<style>
  body { background: var(--bg); }
  .slip-bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .slip-bar h1 { margin: 0; font-size: var(--fs-md); flex: 1; }
  .slips { max-width: 820px; margin: 24px auto 60px; padding: 0 16px; display: grid; gap: 24px; }
  .slip { background: #fff; color: #433C36; border-radius: 18px; border: 1px solid var(--line); box-shadow: var(--sh-1); padding: 32px 36px; }
  .slip-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; border-bottom: 2px solid #433C36; padding-bottom: 12px; }
  .slip-head h2 { margin: 0; font-size: 22px; letter-spacing: .08em; }
  .slip-head .co { font-size: 14px; color: #6b635d; }
  .slip-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 18px; margin: 14px 0 18px; font-size: 14px; }
  .slip-meta div span { display: block; font-size: 12px; color: #787470; }
  .slip-meta b { font-weight: 600; }
  .slip-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .slip table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .slip th { text-align: left; background: #f6f1ec; color: #433C36; font-size: 12px; letter-spacing: .06em; padding: 7px 10px; border-bottom: 1px solid #d9dfdc; position: static; }
  .slip td { padding: 7px 10px; border-bottom: 1px solid #ebe7e3; white-space: normal; vertical-align: top; background: #fff !important; }
  .slip td small { display: block; color: #787470; font-size: 11.5px; }
  .slip td.r, .slip th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .slip tfoot td { font-weight: 700; border-top: 1px solid #c5bdb6; border-bottom: 0; }
  .slip .net { display: flex; justify-content: space-between; align-items: center; margin: 18px 0; padding: 14px 18px; border: 2px solid #433C36; border-radius: 12px; font-size: 16px; font-weight: 600; }
  .slip .net b { font-size: 26px; }
  .slip .att { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; font-size: 13px; margin-bottom: 14px; }
  .slip .att div { background: #f7f4f1; border-radius: 8px; padding: 8px 10px; }
  .slip .att span { display: block; color: #787470; font-size: 11.5px; }
  .slip .disc { font-size: 12px; color: #985F4E; margin-top: 14px; }
  .slip .sign { display: flex; justify-content: space-between; gap: 24px; margin-top: 26px; font-size: 13px; color: #57504a; }
  .slip .sign span { flex: 1; border-top: 1px solid #a59d96; padding-top: 6px; }
  .slip .stamp { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; border: 1px solid; }
  .stamp.ok { color: #88664B; border-color: #88664B; } .stamp.draft { color: #985F4E; border-color: #985F4E; }
  @media (max-width: 640px) { .slip { padding: 20px; } .slip-cols, .slip-meta { grid-template-columns: 1fr; } .slip .att { grid-template-columns: 1fr 1fr; } }
  @media print {
    @page { size: A4; margin: 12mm; }
    body { background: #fff; }
    .slip-bar, .toasts { display: none !important; }
    .slips { margin: 0; padding: 0; max-width: none; gap: 0; }
    .slip { box-shadow: none; border: 0; border-radius: 0; padding: 0; page-break-after: always; break-after: page; }
    .slip:last-child { page-break-after: auto; break-after: auto; }
  }
</style>
</head>
<body>
<div class="slip-bar">
  <h1 id="slipTitle">薪資單</h1>
  <select id="slipEmp" style="width:auto;min-width:160px" aria-label="選擇員工"></select>
  <button class="btn" id="slipPrint"><i data-icon="printer" data-size="18"></i>列印</button>
  <a class="btn secondary" href="/admin"><i data-icon="chevronLeft" data-size="18"></i>回管理後台</a>
</div>
<div class="slips" id="slips"><div class="card empty"><b>載入中…</b></div></div>
<script src="/icons.js"></script>
<script src="/common.js"></script>
<script src="/payslip.js"></script>
</body>
</html>
